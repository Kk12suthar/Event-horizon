name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/eventhorizon-private-release

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-frontend/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-frontend/app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            agent-server/requirements.txt
      - run: pip install -r backend/requirements.txt -r agent-server/requirements.txt
      - run: python -m unittest discover -s backend/tests -p "test_*.py"
      - run: python -m unittest discover -s agent-server/tests -p "test_*.py"

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-server/Dockerfile
          push: false
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: new-frontend/app/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
