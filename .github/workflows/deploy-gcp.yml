name: Deploy GCP

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: eventhorizon-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-50066bb1-72b8-41d4-aa1
  REGION: us-central1
  ZONE: us-central1-a
  REPOSITORY: eventhorizon
  VM_NAME: eventhorizon-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1000666760456/locations/global/workloadIdentityPools/eventhorizon-github/providers/github
          service_account: eventhorizon-github@project-50066bb1-72b8-41d4-aa1.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/agent:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/agent:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: new-frontend/app/Dockerfile
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Upload deployment bundle
        run: |
          tar -czf /tmp/eventhorizon-deploy.tgz docker-compose.prod.yml deploy/vm deploy/postgres
          gcloud compute scp /tmp/eventhorizon-deploy.tgz "${VM_NAME}:/tmp/eventhorizon-deploy.tgz" --project "$PROJECT_ID" --zone "$ZONE" --tunnel-through-iap --quiet

      - name: Roll out and verify
        run: |
          gcloud compute ssh "$VM_NAME" --project "$PROJECT_ID" --zone "$ZONE" --tunnel-through-iap --quiet --command \
            "sudo mkdir -p /opt/eventhorizon && sudo tar -xzf /tmp/eventhorizon-deploy.tgz -C /opt/eventhorizon && sudo chmod +x /opt/eventhorizon/deploy/vm/bootstrap.sh /opt/eventhorizon/deploy/vm/deploy.sh /opt/eventhorizon/deploy/vm/healthcheck.sh && sudo /opt/eventhorizon/deploy/vm/deploy.sh '${GITHUB_SHA}'"
